.overlay { position: fixed; inset: 0; background: linear-gradient(180deg, oklch(0.08 0.03 260 / 55%) 0%, oklch(0.08 0.03 260 / 35%) 40%, oklch(0.06 0.03 260 / 85%) 100%); }
main { position: relative; margin: 0 auto; max-width: 28rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 4rem 1.25rem 3rem; }
.avatar-wrap { position: relative; }
.avatar { width: 7rem; height: 7rem; border-radius: 50%; overflow: hidden; border: 2px solid var(--primary); box-shadow: var(--shadow-glow-strong); }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transform: scale(2.6); }
.crown { position: absolute; top: -1.5rem; left: 50%; width: 2rem; height: 2rem; transform: translateX(-50%); color: var(--accent); filter: drop-shadow(0 0 8px var(--glow)); }
h1 { margin-top: 1.25rem; font-family: "Pirata One", serif; font-weight: 400; font-size: 3rem; line-height: 1.25; letter-spacing: .025em; text-align: center;
  text-shadow: 0 0 12px color-mix(in oklab, var(--glow) 90%, transparent), 0 0 36px color-mix(in oklab, var(--glow) 60%, transparent); }
h1.rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) both, flicker 4s infinite; }
.tagline { margin-top: .5rem; text-align: center; font-weight: 500; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); }
ul { list-style: none; margin-top: 2.5rem; width: 100%; display: flex; flex-direction: column; gap: 1rem; }
.btn { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; border-radius: 1rem; border: 1px solid var(--border);
  background: var(--card); backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%);
  color: var(--fg); text-decoration: none; font-size: 1.125rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  box-shadow: var(--shadow-glow); transition: all .3s; }
.btn:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow-glow-strong); }
.ico { color: var(--accent); display: flex; transition: transform .3s; }
.ico svg { width: 1.25rem; height: 1.25rem; }
.btn:hover .ico { transform: scale(1.1); }
.lbl { flex: 1; text-align: center; }
.sp { width: 1.25rem; }
footer { margin-top: auto; padding-top: 3.5rem; font-size: .875rem; text-transform: uppercase; letter-spacing: .3em; color: var(--muted); text-align: center; }
.rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes zoom { from { transform: scale(1.04); } to { transform: scale(1.12); } }
@keyframes flicker { 0%,45%,49%,74%,100% { opacity: 1; } 47% { opacity: .7; } 72% { opacity: .85; } }
@media (min-width: 640px) { h1 { font-size: 3.75rem; } }
</style>
